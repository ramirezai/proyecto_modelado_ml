# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "ev_ml"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog:
    description: Unity Catalog name

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-da2013f1-4e20.cloud.databricks.com/
    variables:
      catalog: "dev"

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-da2013f1-4e20.cloud.databricks.com/
      root_path: /Workspace/Production/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "prod"
    run_as:
      # This runs as joel@ramirezai.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: joel@ramirezai.com
