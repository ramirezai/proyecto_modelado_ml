resources:
  jobs:
    battery_energy_training_job:
      name: "${bundle.name}_battery_energy_training"
      
      tasks:
        - task_key: train_model
          notebook_task:
            notebook_path: ../src/battery_energy_prediction_training.py
            source: WORKSPACE
            base_parameters:
              catalog: "${var.catalog}"
          
          environment_key: default
          
          timeout_seconds: 7200
      
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"  # Daily at 2 AM
        timezone_id: "America/Los_Angeles"
        pause_status: PAUSED
      
      email_notifications:
        on_failure:
          - joel@ramirezai.com
      
      max_concurrent_runs: 1
      
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - optuna
              - xgboost
              - lightgbm
              - catboost
              - scikit-learn
              - mlflow
      
      tags:
        environment: "${bundle.target}"
        project: "ev_ml"