resources:
  jobs:
    battery_energy_training_job:
      name: battery_energy_training_job
      
      tasks:
        - task_key: train_model
          notebook_task:
            notebook_path: ../src/battery_energy_prediction_training.py
            source: WORKSPACE
          
          new_cluster:
            num_workers: 2
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            spark_conf:
              spark.databricks.cluster.profile: serverless
            custom_tags:
              project: ev_ml
          
          libraries:
            - pypi:
                package: optuna
            - pypi:
                package: xgboost
            - pypi:
                package: lightgbm
            - pypi:
                package: catboost
            - pypi:
                package: scikit-learn
          
          timeout_seconds: 7200
      
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"  # Daily at 2 AM
        timezone_id: "America/Los_Angeles"
        pause_status: PAUSED
      
      email_notifications:
        on_failure:
          - joel@ramirezai.com
      
      max_concurrent_runs: 1
      
      tags:
        environment: "${bundle.target}"
        project: "ev_ml"